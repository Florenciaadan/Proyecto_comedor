<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Administración - Comedor</title>

    <link rel="stylesheet" href="estilos/admin.css">

</head>

<body>

<div class="contenedor">

    <div class="cabecera">

        <h1>Administración - Servicio de Comedor</h1>

    </div>

    <div class="menu">

        <button id="btnPedidos">

            Pedidos

        </button>

        <button id="btnProductos">

            Productos

        </button>

        <button id="btnSalir">

            Cerrar sesión

        </button>

    </div>

    <div id="contenido"></div>

</div>
<!-- MODAL NUEVO PRODUCTO -->

<div id="modalProducto" class="modal">

    <div class="modal-contenido">

        <h2>Nuevo producto</h2>

        <label>Producto</label>

        <input type="text" id="nuevoNombre">

        <label>Precio</label>

        <input type="number" id="nuevoPrecio">

        <label>Unidad</label>

        <select id="nuevaUnidad">

            <option>Unidad</option>
            <option>Docena</option>
            <option>Persona</option>
            <option>Bandeja</option>
            <option>Litro</option>

        </select>

        <label>Estado</label>

        <select id="nuevoEstado">

            <option value="true">Activo</option>
            <option value="false">Inactivo</option>

        </select>

        <div class="modal-botones">

            <button id="cerrarProducto">

                Cancelar

            </button>

            <button id="guardarProducto">

                Guardar

            </button>

        </div>

    </div>

</div>
<!-- MODAL PEDIDO -->

<div id="modalPedido" class="modal">

    <div class="modal-contenido">

        <h2>Detalle del pedido</h2>

        <p><b>Usuario:</b> <span id="detalleUsuario"></span></p>

        <p><b>Fecha del evento:</b> <span id="detalleFecha"></span></p>

        <p><b>Horario:</b> <span id="detalleHora"></span></p>

        <p><b>Lugar:</b> <span id="detalleLugar"></span></p>

        <p><b>Personas:</b> <span id="detallePersonas"></span></p>

        <hr>

        <h3>Productos</h3>

        <div id="detalleProductos"></div>

        <hr>

        <p><b>Total:</b> <span id="detalleTotal"></span></p>

        <p><b>OC / PD:</b> <span id="detalleDocumento"></span></p>

        <p><b>Comentarios:</b></p>

        <textarea
            id="detalleComentarios"
            rows="4"
            readonly
        ></textarea>

        <div class="modal-botones">

            <button id="cerrarPedido">

                Cerrar

            </button>

        </div>

    </div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>>
